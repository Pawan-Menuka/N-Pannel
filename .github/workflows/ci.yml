name: CI

on:
  pull_request:
    branches: [Develop, main]
  push:
    branches: [Develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER: npannel
          POSTGRES_PASSWORD: npannel
          POSTGRES_DB: npannel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npannel -d npannel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, mbstring, bcmath, zip
          coverage: none
      - name: Create test database
        env:
          PGPASSWORD: npannel
        run: psql -h 127.0.0.1 -U npannel -d npannel -v ON_ERROR_STOP=1 -f docker/pgsql/create-test-db.sql
      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: composer lint
      - run: composer analyse
      - name: Unit, feature and architecture tests
        run: composer test
      - run: npx playwright install --with-deps chromium
      - name: Browser journey tests
        run: composer test:browser
